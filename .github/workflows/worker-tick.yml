name: worker-tick
# Runs the background worker (notifications, order expiry, payment reconciliation).
# Needs repository secrets APP_URL (e.g. https://bazarflow.nishak.tech) and CRON_SECRET (same value as the Vercel env var).
# On Vercel Hobby, vercel.json already runs a free daily cron at 3 AM.
# Uncomment the schedule below only if you have configured GitHub secrets and want periodic pings.
on:
  # schedule:
  #   - cron: "0 * * * *" # Hourly ping (uncomment if secrets are configured)
  workflow_dispatch:
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    if: ${{ vars.WORKER_TICK_ENABLED != 'false' }}
    steps:
      - name: Call the worker endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET repository secrets are not configured. Skipping worker tick."
            exit 0
          fi
          code=$(curl -sS -o body.json -w '%{http_code}' -X POST -H "Authorization: Bearer $CRON_SECRET" --max-time 70 "$APP_URL/api/internal/worker" || true)
          cat body.json; echo
          if [ "$code" != "200" ]; then
            echo "::warning ::Worker endpoint returned HTTP $code"
          fi

