name: web
on:
  pull_request:
    paths: ["apps/web/**", "package*.json", ".github/workflows/web.yml"]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          APP_ORIGIN: http://localhost:3000
          MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
          JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdef-0123
          REFRESH_TOKEN_PEPPER: ci-only-pepper-secret-0123456789abcdef-0123
          PAYMENT_WEBHOOK_SECRET: ci-only-webhook-secret-0123456789abcdef-01
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
