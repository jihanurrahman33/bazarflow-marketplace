<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bf-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#042F2E" />
      <stop offset="50%" stop-color="#0B3B38" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="bf-tote" x1="20" y1="20" x2="44" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="bf-flow" x1="14" y1="38" x2="50" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="bf-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base with subtle brand border -->
  <rect width="64" height="64" rx="16" fill="url(#bf-bg)" />
  <rect width="61" height="61" x="1.5" y="1.5" rx="14.5" stroke="#2DD4BF" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Bag Handle -->
  <path d="M26 21 C26 15, 38 15, 38 21" fill="none" stroke="#5EEAD4" stroke-width="3.5" stroke-linecap="round" />

  <!-- Bag Body -->
  <path d="M19 22 H45 L42.8 46.5 C42.5 48.5, 41 50, 39 50 H25 C23 50, 21.5 48.5, 21.2 46.5 Z" fill="url(#bf-tote)" filter="url(#bf-shadow)" />

  <!-- Dynamic Commerce Flow Wave -->
  <path d="M15 39 C22 39, 27 32, 34 32 C40 32, 44 38, 49 29 C45 35, 40 43, 33 43 C26 43, 22 37, 15 39 Z" fill="url(#bf-flow)" />

  <!-- Star Sparkle at Top Right -->
  <path d="M46 13 C46 15.5, 47.5 17, 50 17 C47.5 17, 46 18.5, 46 21 C46 18.5, 44.5 17, 42 17 C44.5 17, 46 15.5, 46 13 Z" fill="#FDE047" />
</svg>
